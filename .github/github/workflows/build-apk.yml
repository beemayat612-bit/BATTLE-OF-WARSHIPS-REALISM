name: Build Offline APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o BattleOfWarships_Offline_Android_Project.zip
          cd BattleOfWarshipsOfflineAndroid

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare offline graphics
        working-directory: BattleOfWarshipsOfflineAndroid
        run: |
          mkdir -p app/src/main/assets
          curl -L https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js -o app/src/main/assets/three.module.js

      - name: Build APK
        working-directory: BattleOfWarshipsOfflineAndroid
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name:
